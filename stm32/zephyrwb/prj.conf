# ---- CNC Vacuum Pump Controller :: STM32WB55 (P-NUCLEO-WB55) / Zephyr 4.4 / LVGL 9.5 ----
# NOTE: Zephyr Kconfig int/string values must NOT have trailing inline comments.

# Peripherals
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_SPI=y

# Uncomment to run without a real sensor (synthetic sweep). See README.
# CONFIG_VAC_SIM=y

# Display stack: GC9A01 over MIPI-DBI-SPI
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_GC9X01X=y

# LVGL (Zephyr module, LVGL 9.x)
CONFIG_LVGL=y
CONFIG_LV_USE_LOG=n
CONFIG_LV_COLOR_DEPTH_16=y
# GC9A01 MCU-16bit iface wants big-endian pixels; LVGL is little-endian.
# Without this the display shows a purplish/green cast (byte-swapped RGB565).
CONFIG_LV_COLOR_16_SWAP=y
# LVGL heap (WB55RG has 192 KiB SRAM1 — keep the pool modest)
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_28=y

# Kernel
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_PRINTK=y
CONFIG_LOG=y
