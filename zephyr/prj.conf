# ---- CNC Vacuum Pump Controller :: Zephyr 4.4 / LVGL 9.5 ----
# NOTE: Zephyr Kconfig int/string values must NOT have trailing inline comments.

# Peripherals
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_SPI=y

# Console over the built-in USB-Serial-JTAG (single native-USB cable)
CONFIG_SERIAL=y
CONFIG_SERIAL_ESP32_USB=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Display stack: GC9A01 over MIPI-DBI-SPI
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_GC9X01X=y

# Onboard RGB LED (WS2812 on GPIO48) as a visible heartbeat
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# N16R8 module: 16 MB flash
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y

# LVGL (Zephyr module, LVGL 9.x)
CONFIG_LVGL=y
CONFIG_LV_USE_LOG=n
CONFIG_LV_COLOR_DEPTH_16=y
# LVGL heap ~ the old lv_conf.h LV_MEM_SIZE (64 KiB)
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
# big vacuum-value readout (placeholder UI)
CONFIG_LV_FONT_MONTSERRAT_28=y

# Kernel
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=49152
CONFIG_PRINTK=y
CONFIG_LOG=y
